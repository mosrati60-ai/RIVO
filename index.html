<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#08090b">
<title>RIVO — Taxi Moto Tunisia</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#08090b;--panel:#111317;--line:#30343b;--muted:#a4a9b1;--orange:#ff7900;--gold:#ffb000;--white:#f7f7f7;--card:#17191d;--input:#090b0e}
body.light{--bg:#eef0f4;--panel:#fff;--line:#d8dde5;--muted:#5a6270;--white:#0b0d10;--card:#fff;--input:#f4f6f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Tahoma,sans-serif;min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
header{height:66px;position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 95%,transparent);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-style:italic;font-size:26px;letter-spacing:.6px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#08090b;font-size:30px;font-weight:1000;font-style:italic;background:linear-gradient(135deg,#ffc000,#ff6500);box-shadow:0 0 20px #ff790077,inset 0 1px 0 #fff8;transform:skewX(-7deg);border:1px solid #ffc05a}
.brand small{display:block;font-size:9px;letter-spacing:2px;color:var(--muted);font-style:normal}
.hbtns{display:flex;gap:4px;align-items:center}
.hbtn{background:none;color:var(--white);font-size:20px;width:40px;height:40px;position:relative;border-radius:10px;display:grid;place-items:center}
.hbtn:hover{background:var(--card)}
.redDot{position:absolute;right:6px;top:6px;background:#f22;width:9px;height:9px;border-radius:50%;display:none}
main{max-width:1120px;margin:auto;padding:16px 14px 95px}
.screen{opacity:0;transform:translateX(20px);transition:opacity .3s,transform .3s;display:none}
.screen.active{display:block;opacity:1;transform:translateX(0)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#splash{position:fixed;inset:0;z-index:5000;background:linear-gradient(160deg,#090a0c,#140b06);display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .5s;color:#fff}
#splash.hide{opacity:0;pointer-events:none}
#splash .big-logo{width:100px;height:100px;border-radius:26px;display:grid;place-items:center;color:#08090b;font-size:64px;font-weight:1000;font-style:italic;background:linear-gradient(135deg,#ffc000,#ff6500);box-shadow:0 0 40px #ff7900aa;transform:skewX(-7deg);border:2px solid #ffc05a;animation:spinLogo 1s ease}
@keyframes spinLogo{from{transform:skewX(-7deg) scale(.5);opacity:0}to{transform:skewX(-7deg) scale(1);opacity:1}}
#splash h1{font-size:34px;font-style:italic;letter-spacing:2px;margin:20px 0 4px;background:linear-gradient(100deg,#ff6500,#ffb000);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash p{color:#aaa;font-size:12px;letter-spacing:4px;margin:0}
.promo-banner{background:linear-gradient(100deg,#ff7900,#ffb000);color:#160d04;padding:12px 16px;border-radius:14px;margin-bottom:13px;display:flex;align-items:center;gap:10px;font-weight:bold;font-size:13px;cursor:pointer;box-shadow:0 6px 20px #ff790033}
.promo-banner .ico{font-size:22px}
.promo-banner .close-promo{margin-left:auto;background:#0003;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;color:#160d04;font-weight:900}
#offlineBar{position:fixed;top:0;left:0;right:0;z-index:9999;background:#7f1d1d;color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:bold;display:none}
#offlineBar.on{display:block}
.headline{display:flex;align-items:center;justify-content:space-between;margin:10px 3px 15px}
.headline h1{font-size:25px;margin:4px 0;background:linear-gradient(100deg,var(--white),#ffb000);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px;position:relative;overflow:hidden;transition:border-color .2s}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#ff790044,transparent)}
.card h2{font-size:17px;margin:0 0 12px}
.map{height:245px;position:relative;overflow:hidden;border-radius:16px;border:1px solid #3a4653;background:#192431;z-index:1}
#mapOverlay{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);flex-direction:column}
#mapOverlay.open{display:flex}
#mapOverlay .mapTop{display:flex;gap:7px;align-items:center;padding:10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#mapOverlay .mapTop button{border:1px solid #4b515b;background:#252a31;color:#fff;border-radius:10px;padding:11px 12px;font-weight:bold}
#mapOverlay .mapTop button.sel{background:linear-gradient(100deg,#ff6500,#ffb000);color:#160d04;border:0}
#mapOverlay .mapTop .closeMap{margin-left:auto;background:#451b1b}
#mapOverlay #mapHost{flex:1;min-height:0}
.leaflet-container{font-family:Arial,Tahoma,sans-serif}
.locations{background:#fff;color:#101114;border-radius:16px;margin-top:8px;overflow:hidden}
.locrow{height:55px;display:flex;align-items:center;padding:0 14px;gap:12px;border-bottom:1px solid #ddd;font-weight:bold}
.locrow:last-child{border:0}
.locicon{font-size:23px;color:#087cff}
.locrow input{border:0;outline:0;background:transparent;color:#111;width:100%;font-weight:bold;font-size:15px;min-width:0}
.locrow input::placeholder{color:#333}
.mic-btn{background:none;font-size:22px;color:#ff6500;padding:4px 6px;border-radius:8px}
.mic-btn.listening{background:#ff6500;color:#fff;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.estimates{display:none;grid-template-columns:repeat(3,1fr);background:#fff;color:#111;border-radius:15px;margin-top:7px;overflow:hidden}
.estimates.ready{display:grid;animation:fade .28s}
.estimate{text-align:center;padding:11px 3px;border-left:1px solid #bbb;cursor:pointer;transition:background .15s}
.estimate:last-child{border:0}
.estimate.sel{background:#ffe9cc}
.estimate .sym{font-size:22px;display:block}
.estimate small{display:block;font-size:11px;margin:5px 0}
.estimate b{font-size:17px}
.btn{width:100%;padding:14px;border-radius:30px;background:linear-gradient(100deg,#ff6500,#ffb000);font-weight:900;color:#160d04;margin-top:10px;font-size:16px;transition:transform .1s;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,#ffffff33,transparent);transition:left .7s;pointer-events:none}
.btn:hover::after{left:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dark{background:#252930;color:var(--white);border:1px solid #414751}
.btn.red{background:#391719;color:#ff9292}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--input);border:1px solid var(--line);color:var(--white);border-radius:10px;padding:12px}
.phone-entry{display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.phone-entry span{font-weight:900;color:#ffad36;border-inline-end:1px solid var(--line);padding:12px 10px 12px 0}
.phone-entry input{border:0!important;background:transparent!important;outline:0;text-align:left}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:9;background:color-mix(in srgb,var(--bg) 95%,transparent);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 2px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.bottom button{flex:1;max-width:150px;background:none;color:var(--muted);font-size:10px;padding:4px}
.bottom button span{display:block;font-size:22px;margin-bottom:3px}
.bottom button.active{color:#ff9b18}
.drawerShade,.modalShade{position:fixed;inset:0;background:#000b;z-index:20;display:none}
.modalShade{z-index:1100}
.drawerShade.open,.modalShade.open{display:block}
.drawer{position:absolute;right:0;top:0;height:100%;width:min(340px,86vw);background:var(--panel);border-left:1px solid #4a321e;padding:22px 17px;box-shadow:-10px 0 30px #0008;animation:slideIn .25s;overflow-y:auto}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawerHead{display:flex;align-items:center;gap:14px;padding:14px 4px 24px;border-bottom:1px solid var(--line)}
.avatar{width:62px;height:62px;border:3px solid var(--orange);border-radius:50%;display:grid;place-items:center;font-size:30px}
.drawerItem{width:100%;display:flex;align-items:center;gap:15px;background:transparent;color:var(--white);padding:16px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.drawerItem span{font-size:22px;width:30px;text-align:center}
.drawerItem.logout{color:#ff5555;border:0;margin-top:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;transition:transform .2s}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;color:var(--orange);font-size:21px}
.stat small{color:var(--muted);font-size:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0}
.itemtop{display:flex;justify-content:space-between;gap:8px}
.status{font-size:10px;border-radius:20px;background:#392817;color:#ffbb72;padding:5px 8px}
.status.done{background:#123322;color:#70e5a5}
.status.cancel{background:#381719;color:#ff9292}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.wallet{background:linear-gradient(120deg,#3b1b08,#121418);border:1px solid #79421b;border-radius:16px;padding:18px;position:relative;overflow:hidden}
.wallet::after{content:"";position:absolute;top:-40%;right:-20%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#ffb00044,transparent 70%);pointer-events:none}
.wallet strong{font-size:30px;color:#ffb54b;display:block;margin:8px 0;position:relative;z-index:2}
.muted{color:var(--muted);font-size:12px;line-height:1.7}
.modal{position:absolute;top:50%;left:50%;width:min(430px,90vw);max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid #5a442f;border-radius:18px;padding:20px;opacity:0;transform:translate(-50%,-50%) scale(.9);transition:opacity .25s,transform .25s}
.modalShade.open .modal{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal h2{margin-top:0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:2000;opacity:0;transition:all .3s;pointer-events:none;border:1px solid #374151;box-shadow:0 10px 30px #0008;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);animation:pop .3s}
@keyframes pop{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.02)}100%{transform:translateX(-50%) scale(1)}}
.toast.ok{border-color:#10b981;background:#064e3b}
.toast.err{border-color:#ef4444;background:#7f1d1d}
.otp-row{display:flex;gap:8px;justify-content:center;margin:15px 0}
.otp-row input{width:48px;height:56px;text-align:center;font-size:22px;font-weight:900;background:var(--input);border:1px solid var(--line);color:var(--white);border-radius:10px}
.stars{display:flex;gap:8px;justify-content:center;margin:15px 0;font-size:38px;cursor:pointer}
.stars span{opacity:.3;transition:opacity .15s,transform .15s}
.stars span.on{opacity:1;transform:scale(1.1)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;font-size:12px;white-space:nowrap}
.tabs button.active{background:linear-gradient(100deg,#ff6500,#ffb000);color:#160d04;border:0;font-weight:900}
.chat-box{height:200px;overflow-y:auto;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.4}
.msg.me{align-self:flex-end;background:linear-gradient(100deg,#ff6500,#ffb000);color:#160d04}
.msg.them{align-self:flex-start;background:#252930;color:#fff}
.msg small{display:block;font-size:9px;opacity:.7;margin-top:3px}
.chat-input{display:flex;gap:6px}
.chat-input input{flex:1;background:var(--input);border:1px solid var(--line);color:var(--white);border-radius:10px;padding:10px}
.chat-input button{background:linear-gradient(100deg,#ff6500,#ffb000);color:#160d04;font-weight:900;padding:10px 16px;border-radius:10px}
.sos-btn{background:#7f1d1d!important;border:1px solid #ef4444!important;color:#fff!important}
.promo-row{display:flex;gap:6px;margin:8px 0}
.promo-row input{flex:1;background:var(--input);border:1px solid var(--line);color:var(--white);border-radius:10px;padding:10px}
.promo-row button{background:var(--orange);color:#160d04;font-weight:900;padding:10px 16px;border-radius:10px}
.eta{display:inline-block;background:#064e3b;color:#70e5a5;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold;margin:5px 0}
#onboarding{position:fixed;inset:0;z-index:3000;background:linear-gradient(160deg,#090a0c,#140b06);display:none;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center}
#onboarding.open{display:flex}
#onboarding .slide{display:none;max-width:400px;animation:fade .3s}
#onboarding .slide.active{display:block}
#onboarding .slide .big{font-size:80px;margin-bottom:20px}
#onboarding .slide h2{font-size:26px;margin:0 0 12px;color:#fff}
#onboarding .slide p{color:#bbb;font-size:14px;line-height:1.6}
#onboarding .dots{display:flex;gap:8px;margin:25px 0}
#onboarding .dots span{width:10px;height:10px;border-radius:50%;background:#555}
#onboarding .dots span.on{background:var(--orange)}
#onboarding .ob-btns{display:flex;gap:10px;width:100%;max-width:400px}
#onboarding .ob-btns button{flex:1}
.pay-options{display:grid;gap:8px;margin:12px 0}
.pay-opt{display:flex;align-items:center;gap:12px;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.pay-opt.sel{border-color:var(--orange);background:#1f1409}
.pay-opt span{font-size:24px}
.pay-opt b{flex:1;color:var(--white)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.badge{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:10px}
.badge.on{border-color:var(--orange);background:#1f1409}
.badge .ico{font-size:26px;display:block;margin-bottom:4px}
.badge small{color:var(--muted);font-size:9px}
.weather{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.weather .ico{font-size:32px}
.weather b{font-size:18px}
.weather small{color:var(--muted);font-size:11px;display:block}
.referral{background:linear-gradient(120deg,#1e3a8a,#0f172a);border:1px solid #3b82f6;border-radius:14px;padding:14px;margin-top:12px;color:#fff}
.referral b{color:#93c5fd}
.referral .ref-code{background:#0008;padding:8px 12px;border-radius:8px;font-family:monospace;font-size:16px;font-weight:bold;display:inline-block;margin:8px 0;letter-spacing:2px}
.drivers-list{display:grid;gap:8px;margin-top:10px}
.driver-card{display:flex;align-items:center;gap:12px;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px;transition:transform .2s,border-color .2s}
.driver-card:hover{transform:translateY(-2px);border-color:var(--orange)}
.driver-card .av{width:44px;height:44px;background:linear-gradient(135deg,#ffc000,#ff6500);border-radius:50%;display:grid;place-items:center;font-size:22px;color:#160d04}
.driver-card b{display:block;font-size:14px}
.driver-card small{color:var(--muted);font-size:11px}
.driver-card .side{margin-left:auto;text-align:right}
.driver-card .side b{color:var(--orange)}
.fav-btn{background:none;font-size:22px;color:#555;padding:0 4px}
.fav-btn.on{color:#ff4477}
#wheel-container{position:relative;width:220px;height:220px;margin:20px auto}
#wheel{width:100%;height:100%;border-radius:50%;background:conic-gradient(#ff6500 0deg 45deg,#ffb000 45deg 90deg,#10b981 90deg 135deg,#3b82f6 135deg 180deg,#8b5cf6 180deg 225deg,#ec4899 225deg 270deg,#f59e0b 270deg 315deg,#ef4444 315deg 360deg);border:6px solid #fff;box-shadow:0 0 30px #ff7900aa;transition:transform 4s cubic-bezier(.17,.67,.3,1)}
#wheel-pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:34px;color:#fff;text-shadow:0 0 10px #000;z-index:5}
.auth-wrap{display:grid;grid-template-columns:1fr;gap:0;min-height:calc(100vh - 66px);border-radius:26px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:0 24px 60px #0008}
@media(min-width:800px){.auth-wrap{grid-template-columns:1.1fr 1fr}}
.auth-hero{position:relative;padding:38px 28px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;background:linear-gradient(160deg,#1a0e04 0%,#0b0c10 60%,#140b06 100%);overflow:hidden}
.auth-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#ff790033,transparent 45%),radial-gradient(circle at 80% 80%,#ffb00022,transparent 50%);pointer-events:none}
.auth-orbs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:float 8s ease-in-out infinite}
.orb.o1{width:180px;height:180px;background:#ff6500;top:-40px;right:-40px}
.orb.o2{width:140px;height:140px;background:#ffb000;bottom:40px;left:-40px;animation-delay:2s}
.orb.o3{width:90px;height:90px;background:#ff9b18;bottom:-20px;right:30%;animation-delay:4s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.08)}}
.auth-logo{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:48px;font-weight:1000;font-style:italic;color:#08090b;background:linear-gradient(135deg,#ffc000,#ff6500);box-shadow:0 0 40px #ff790088,inset 0 1px 0 #fff8;border:2px solid #ffc05a;transform:skewX(-7deg);margin-bottom:16px;animation:spinLogo 1.1s ease}
.auth-title{font-size:34px;font-weight:900;font-style:italic;letter-spacing:2px;margin:0;background:linear-gradient(100deg,#ff6500,#ffb000);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-tag{color:#a4a9b1;font-size:11px;letter-spacing:4px;margin:4px 0 26px;font-weight:600}
.auth-features{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;position:relative;z-index:2}
.auth-feat{display:flex;align-items:center;gap:12px;background:#ffffff08;border:1px solid #ffffff12;border-radius:14px;padding:11px 13px;backdrop-filter:blur(6px)}
.auth-feat span{font-size:22px}
.auth-feat b{display:block;font-size:13px;color:#fff}
.auth-feat small{font-size:11px;color:#a4a9b1}
.auth-card{padding:28px 22px;background:var(--bg);display:flex;flex-direction:column;justify-content:center}
.auth-tabs{display:flex;gap:6px;margin-bottom:22px;background:var(--input);padding:5px;border-radius:14px;border:1px solid var(--line)}
.auth-tab{flex:1;padding:11px;border-radius:10px;background:none;color:v
