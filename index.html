<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>Taxi Moto Tunisia 🇹🇳</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef3f8;
 color:#10233f;
 line-height:1.6
}
button,input,select,textarea{font:inherit}
button{
 border:0;border-radius:12px;padding:13px;
 cursor:pointer;font-weight:bold;
 min-height:45px;margin:4px
}
button:active{transform:scale(.98)}
input,select,textarea{
 width:100%;padding:13px;margin:7px 0;
 border:1px solid #d8e1eb;border-radius:10px;
 background:white
}
.hero{
 min-height:100vh;padding:25px;
 color:white;text-align:center;
 display:flex;flex-direction:column;
 justify-content:space-between;align-items:center;
 background:linear-gradient(#10233fc9,#10233fee),
 url("https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=1600&q=85") center/cover
}
.logo{font-size:30px;font-weight:bold}
.flag{font-size:65px}
.welcome{margin:auto}
.welcome h1{font-size:35px}
.buttons{width:100%;max-width:450px}
.buttons button{width:100%;margin:7px}
.clientBtn{background:#ff9417;color:white}
.driverBtn{background:white;color:#10233f}
.adminBtn{background:#dce5f3;color:#10233f}
.page{
 display:none;min-height:100vh;padding:15px;
 background:linear-gradient(135deg,#edf3f9,#e6edf5)
}
.card{
 background:white;padding:20px;
 border-radius:17px;margin:13px auto;
 max-width:850px;box-shadow:0 5px 20px #10233f12
}
h2{border-right:4px solid #ff9417;padding-right:10px}
.primary{background:#ff9417;color:white;width:100%}
.back{background:#10233f;color:white;width:100%}
.green{background:#16834a;color:white}
.red{background:#bd3442;color:white}
.blue{background:#1769aa;color:white}
.whatsapp{background:#18864b;color:white;width:100%}
.info{background:#fff4e5;padding:12px;border-radius:10px}
.item{background:#f3f5f9;padding:13px;border-radius:10px;margin:10px 0}
.price{color:#16834a;font-size:22px;font-weight:bold}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#10233f;color:white;padding:15px;text-align:center;border-radius:12px}
.stat b{display:block;font-size:24px;color:#ff9417}
.map{height:350px;border-radius:14px;margin:12px 0}
.hide{display:none!important}
@media(min-width:700px){
 .stats{grid-template-columns:repeat(4,1fr)}
 .buttons{display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<!-- HOME -->
<section class="hero" id="home">
 <div class="logo">TAXI <span style="color:#ff9417">MOTO</span></div>
 <div class="welcome">
  <div class="flag">🇹🇳</div>
  <h1>مرحبا بيك في Taxi Moto Tunisia</h1>
  <p>تنقّل سريع، آمن وسهل في تونس</p>
  <div style="font-size:65px">🏍️</div>
 </div>
 <div class="buttons">
  <button class="clientBtn" onclick="showPage('clientLogin')">👤 Client</button>
  <button class="driverBtn" onclick="showPage('driverLogin')">🏍️ Driver</button>
  <button class="adminBtn" onclick="showPage('adminLogin')">⚙️ Admin</button>
 </div>
 <p>© 2026 Taxi Moto Tunisia</p>
</section>

<!-- CLIENT LOGIN -->
<section class="page" id="clientLogin">
 <div class="card">
  <h2>دخول الحريف 👤</h2>
  <input id="clientName" placeholder="اسمك الكامل">
  <input id="clientPhone" type="tel" placeholder="رقم الهاتف">
  <button class="primary" onclick="clientEnter()">دخول</button>
  <button class="back" onclick="showPage('home')">رجوع</button>
 </div>
</section>

<!-- CLIENT DASHBOARD -->
<section class="page" id="client">
 <div class="card">
  <h2>مرحبا بيك ❤️</h2>
  <p id="clientWelcome"></p>
  <h2>اطلب رحلة جديدة 🏍️</h2>

  <input id="departure" placeholder="نقطة الانطلاق">
  <input id="destination" placeholder="الوجهة">

  <div id="clientMap" class="map"></div>

  <button class="primary" onclick="requestRide()">تأكيد طلب الرحلة</button>

  <div id="clientMessage" class="info"></div>
  <h2>رحلاتي</h2>
  <div id="clientRides"></div>

  <button class="whatsapp" onclick="contactWhatsApp()">تواصل عبر WhatsApp</button>
  <button class="back" onclick="logout()">خروج</button>
 </div>
</section>

<!-- DRIVER LOGIN -->
<section class="page" id="driverLogin">
 <div class="card">
  <h2>دخول السائق 🏍️</h2>
  <input id="driverName" placeholder="اسم السائق">
  <input id="driverPhone" type="tel" placeholder="رقم الهاتف">
  <input id="driverCode" type="password" placeholder="كلمة المرور">
  <button class="primary" onclick="driverEnter()">دخول</button>
  <button class="back" onclick="showPage('home')">رجوع</button>
 </div>
</section>

<!-- DRIVER DASHBOARD -->
<section class="page" id="driver">
 <div class="card">
  <h2>فضاء السائق 🏍️</h2>
  <p id="driverWelcome"></p>
  <h2>الطلبات المتاحة</h2>
  <div id="driverRides"></div>
  <h2>رحلاتي المقبولة</h2>
  <div id="driverAccepted"></div>
  <button class="back" onclick="logout()">خروج</button>
 </div>
</section>

<!-- ADMIN LOGIN -->
